const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(BLOB.salt),iterations:BLOB.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(BLOB.iv)},key,b64(BLOB.ct));return new TextDecoder().decode(pt);}
async function unlock(pw,remember){const btn=document.getElementById("go"),err=document.getElementById("err");btn.disabled=true;btn.textContent="解密中 Decrypting…";err.textContent="";
try{const h=await dec(pw);if(remember)localStorage.setItem(K,pw);document.open();document.write(h);document.close();}
catch(e){localStorage.removeItem(K);err.textContent="密码错误 / Wrong password";btn.disabled=false;btn.textContent="解锁 Unlock";}}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();unlock(document.getElementById("pw").value,document.getElementById("rem").checked);});
const saved=localStorage.getItem(K);if(saved)unlock(saved,true);
</script></body></html>
